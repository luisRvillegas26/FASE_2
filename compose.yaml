services:
  api:
    build: .
    image: opella-demanda-api:1.0.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      LOG_LEVEL: "info"
      API_KEY: "${API_KEY:-}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
